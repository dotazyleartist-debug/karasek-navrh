<!doctype html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typ řešení | Karásek s.r.o.</title>
<meta name="description" id="mDesc" content="Zimní zahrady, zasklení teras, pergoly a stínění od Karásek s.r.o. Showroom Nemanická 5, České Budějovice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;subset=latin-ext&amp;display=swap" rel="stylesheet">
<style>
/* Stránka jednoho typu řešení, směr A (produkt.html?o=<oblast>&p=<slug>).
   Data: katalog.js, obsah-sluzeb.js (parametry), realizace-data.js (stavby). Fakta jen ze zdrojů, nic doplněného. */
:root{
  --ink:#0f1418; --muted:#4a545c; --bg:#fff; --soft:#f4f6f7; --dark:#1d2328; --line:#dde2e5;
  --red:#D22630; --red-h:#b51f28;
  --zahrada:#46bb59; --zaskleni:#00b8f1; --pergola:#ff9a1f; --stineni:#ff2d16;
  --r-card:16px; --r-btn:12px;
  --shadow:0 18px 48px rgba(15,20,24,.12), 0 2px 6px rgba(15,20,24,.06);
  --pad:32px; --max:1320px; --f:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;font-family:var(--f);font-weight:500;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-btn);z-index:99}
.skip:focus{top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 17px/1.2 var(--f);border:0;border-radius:var(--r-btn);padding:16px 22px;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,transform .15s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-h)}
.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #c3cad0}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
.lnk{font-weight:700;font-size:16px;text-underline-offset:4px}

/* hero */
.crumbs{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:15px;color:var(--muted);padding:24px 0 20px}
.crumbs a{font-weight:600;color:var(--ink);text-underline-offset:4px}
.ph-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:48px;align-items:center;padding-bottom:64px}
.ph-hero h1{font-size:60px;line-height:1.05;letter-spacing:-.03em}
.ph-hero .lead{margin-top:20px;font-size:19px;line-height:1.55;color:var(--muted);max-width:560px}
.ph-hero .acts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:28px}
.ph-img{border-radius:var(--r-card);overflow:hidden;background:var(--soft);box-shadow:var(--shadow)}
.ph-img img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.ph-img figcaption{padding:12px 18px;font-size:14px;color:var(--muted);background:#fff}
.ph-img figcaption a{color:var(--ink);font-weight:700;text-underline-offset:3px}
/* typ bez vlastní fotky (design-eye 28. 11.): místo cizí stavby panel s parametry, ve stejném rámu jako fotka */
.ph-pan{background:var(--soft);border-radius:var(--r-card);border-top:6px solid var(--kc,var(--modra,#0869eb));padding:30px 34px 32px;align-self:start;display:flex;flex-direction:column;gap:20px}
.ph-pan .pp-k{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph-pan dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px}
.ph-pan dt{font-size:14px;font-weight:700;color:var(--muted)}
.ph-pan dd{margin:4px 0 0;font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.ph-pan .pp-n{padding-top:18px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.ph-pan .pp-a{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.ph-pan .pp-a a{font-weight:700;text-underline-offset:4px}

/* sekce */
.sec{padding:64px 0;border-top:1px solid var(--line)}
.sec h2{font-size:36px;max-width:760px}
.sec .sub{margin-top:12px;color:var(--muted);font-size:17px;max-width:680px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:28px}
.rgrid>*{min-width:0}
.after{margin-top:28px}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}
.par:has(>section:only-child){grid-template-columns:minmax(0,1fr)}
.par:has(>section:only-child) dl,.par dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px}
.par:has(>section:only-child) dl{grid-template-columns:repeat(3,minmax(0,1fr))}
.ph-hero .btn-dark{background:var(--red);color:#fff}
.ph-hero .btn-dark:hover{background:var(--red-h)}
.par section{background:var(--soft);border-radius:var(--r-card);padding:24px 26px}
.par h3{font-size:20px;margin-bottom:12px}
.par dl{margin:0;display:grid;gap:10px}
.par dt{font-size:14px;font-weight:700;color:var(--muted)}
.par dd{margin:0;font-size:16px;line-height:1.45}
.vyh{margin:14px 0 0;padding:0 0 0 20px;font-size:16px;line-height:1.45}
.vyh li+li{margin-top:6px}
.par dd{overflow-wrap:anywhere}
.src{margin-top:16px;font-size:14px;color:var(--muted)}
.src a{text-underline-offset:3px}
.vwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:28px}
.vid{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:16/9;background:#20282e}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vid .play{position:absolute;left:20px;bottom:20px;background:#fff;color:var(--ink)}
.vid .play:hover{background:#f1f3f4}
.vid .play svg{width:14px;height:14px}
.vwrap h3{font-size:26px;line-height:1.15}
.vwrap p{margin-top:12px;font-size:16px;color:var(--muted);max-width:440px}
.sib{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sib a{display:flex;flex-direction:column;gap:4px;height:100%;padding:16px 18px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);text-decoration:none}
.sib a:hover{box-shadow:0 0 0 1px var(--ink)}
.sib b{font-size:17px;line-height:1.3}
.sib span{font-size:14px;color:var(--muted);font-weight:600}
.cta{background:var(--dark);color:#fff;padding:64px 0}
.cta .in{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between}
.cta h2{font-size:34px;max-width:640px}
.cta p{margin-top:10px;color:#dfe5e9;max-width:560px}
.cta .btns{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.cta .btn-line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #8a949b}
.cta .btn-line:hover{box-shadow:inset 0 0 0 1.5px #fff}

/* nenalezeno */
.nf{padding:24px 0 96px}
.nf h1{font-size:48px;max-width:760px}
.nf p{margin-top:16px;font-size:18px;color:var(--muted);max-width:620px}
.nf .tl{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nf .tl a{display:block;padding:18px 20px;border-radius:14px;box-shadow:0 0 0 1px var(--line);text-decoration:none;font-weight:700;font-size:18px}
.nf .tl a:hover{box-shadow:0 0 0 1px var(--ink)}
.nf .acts{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}

/* krátká odpověď pod H1 (blok WP „Krátká odpověď“: co, pro koho, cena, jak dlouho) */
.ko{margin:24px 0 0;max-width:600px}
.ko dl{margin:0}
.ko dl>div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 20px;padding:12px 0;border-top:1px solid var(--line)}
.ko dl>div:last-child{border-bottom:1px solid var(--line)}
.ko dt{font-size:14px;font-weight:700;color:var(--muted);padding-top:2px}
.ko dd{margin:0;font-size:16px;line-height:1.5}
.ko dd b{font-weight:700}
.par-blok+.par-blok{margin-top:40px}
.par-blok>h3{font-size:22px}
/* otázky k typu */
.faq-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px 56px;align-items:start}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;font-weight:700;font-size:18px;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:0 0 11px;height:11px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-3px,-3px);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(225deg) translate(-3px,-3px)}
.faq .fa{padding:0 0 20px;max-width:680px}
.faq .fa p{font-size:16px;line-height:1.55;color:var(--muted)}
.faq .fz{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
.faq .fz a{text-underline-offset:3px}
.cta .kon{margin-top:16px;font-size:15px;color:#dfe5e9}
.cta .kon a{color:#fff;font-weight:700;text-underline-offset:3px}
.cta .btn-tel svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.faq summary::after{transition:none}}
@media (max-width:1100px){.faq-g{grid-template-columns:1fr}}
@media (max-width:820px){
  .ko dl>div{grid-template-columns:1fr;gap:2px;padding:10px 0}
  .ko dd{font-size:15px}
  .faq summary{font-size:16px;padding:15px 0}
  .faq .fa p{font-size:15px}
}
@media (max-width:1100px){
  .ph-hero{grid-template-columns:1fr;gap:28px}
  .rgrid,.sib{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vwrap{grid-template-columns:1fr;gap:20px}
}
@media (max-width:820px){
  :root{--pad:16px}
  body{font-size:16px}
  .crumbs{font-size:14px;padding:16px 0 14px}
  .ph-hero{padding-bottom:40px;gap:22px}
  .ph-hero h1{font-size:38px;line-height:1.08}
  .ph-hero .lead{font-size:16px;margin-top:14px}
  .ph-hero .acts{margin-top:20px}
  .ph-hero .acts .btn{width:100%}
  .ph-img{order:-1}
  .ph-hero.pod .ph-img{order:0}
  .ph-hero .ph-img.vl{order:-1}
  .ph-pan{padding:22px 20px 24px;gap:16px}
  .ph-pan dl{grid-template-columns:1fr;gap:12px}
  .ph-pan dd{font-size:18px}
  .sec{padding:40px 0}
  .sec h2,.cta h2{font-size:28px}
  .rgrid,.sib,.par,.nf .tl{grid-template-columns:1fr}
  .par section{padding:18px}
  .par dl,.par:has(>section:only-child) dl{grid-template-columns:1fr}
  .cta{padding:40px 0}
  .cta .btn{width:100%}
  .nf h1{font-size:34px}
}

/* TOP-CR balík A (28. 11. 2026): pruh důkazů, fotky ze stavby, podtémata, srovnání, recenze */
.ph-hero{padding-bottom:40px}
.pd{list-style:none;margin:0 0 48px;padding:22px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.pd li{display:flex;flex-direction:column;gap:2px;padding:2px 24px;min-width:0}
.pd li:first-child{padding-left:0}
.pd li+li{border-left:1px solid var(--line)}
.pd b{font-size:24px;line-height:1.2;letter-spacing:-.01em}
.pd span{font-size:15px;line-height:1.35;color:var(--muted)}

.pd li:first-child b{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em} /* Google 4,9 aspoň 48 px (laťka, design-eye 28. 11.) */
.pd a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.gl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.gl.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gl button{position:relative;display:block;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--soft);aspect-ratio:4/3;min-width:0}
.gl button:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.gl img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gl button:hover img{transform:scale(1.03)}
.gl button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gl-p{margin-top:16px;font-size:15px;color:var(--muted)}
.gl-p a{color:var(--ink);font-weight:700;text-underline-offset:3px}
.lb{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(13,17,20,.96);color:#fff;overflow:hidden}
.lb:not([open]){display:none}
.lb::backdrop{background:#0d1114}
.lb-stage{position:absolute;inset:56px 64px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none}
.lb button{position:absolute;display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:#fff;color:var(--ink);cursor:pointer}
.lb button:hover{background:#e6eaec}
.lb button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lb-x{top:8px;right:8px}.lb-p{left:8px;top:50%;margin-top:-24px}.lb-n{right:8px;top:50%;margin-top:-24px}
.lb-c{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;pointer-events:none}
.tm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 56px;align-items:center}
.tm+.tm{margin-top:64px}
.tm:nth-child(even) .tm-f{order:-1}
.tm h2{font-size:32px}
.tm .tp{margin-top:12px;font-size:17px;color:var(--muted);max-width:560px}
.tm dl{margin:20px 0 0}
.tm dl>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 20px;padding:11px 0;border-top:1px solid var(--line)}
.tm dl>div:last-child{border-bottom:1px solid var(--line)}
.tm dt{font-size:14px;font-weight:700;color:var(--muted);padding-top:2px}
.tm dd{margin:0;font-size:16px;line-height:1.5}
.tm-f{margin:0;border-radius:var(--r-card);overflow:hidden;background:var(--soft)}
.tm-f img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.tm-f figcaption{padding:12px 18px;font-size:14px;color:var(--muted);background:#fff}
.odk{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0}
.odk a{display:inline-flex;padding:9px 15px;border-radius:999px;box-shadow:inset 0 0 0 1px #c3cad0;font-size:15px;font-weight:700;text-decoration:none}
.odk a:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cmp{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:28px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:14px 20px;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
.cmp thead th,.cmp thead td{border-top:0;padding-bottom:16px;font-size:19px}
.cmp thead a{text-underline-offset:4px}
.cmp tbody th{width:20%;padding-left:0;font-size:14px;font-weight:700;color:var(--muted)}
.cmp .cur{background:var(--soft)}
.cmp thead .cur{border-radius:12px 12px 0 0}
.rv{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr) minmax(0,1fr);gap:20px 28px;align-items:stretch}
.rv-n{display:flex;align-items:baseline;gap:12px;margin-top:20px}
.rv-n b{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.rv-n span{font-size:15px;color:var(--muted);line-height:1.35}
.rv .sub a{color:var(--ink);font-weight:700;text-underline-offset:3px}
.q{margin:0;background:var(--soft);border-radius:var(--r-card);padding:28px 28px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.q p{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.01em}
.q cite{font-style:normal;font-size:15px;color:var(--muted)}
.q cite b{color:var(--ink)}
h3.dal{font-size:22px;margin-top:44px}
@media (prefers-reduced-motion:reduce){.gl img{transition:none}}
@media (max-width:1100px){
  .pd{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 0}
  .pd li:nth-child(3){padding-left:0;border-left:0}
  .tm{grid-template-columns:1fr}
  .tm:nth-child(even) .tm-f{order:0}
  .rv{grid-template-columns:1fr 1fr}
  .rv>div:first-child{grid-column:1/-1}
}
@media (max-width:820px){
  .ph-hero{padding-bottom:28px}
  .pd{margin-bottom:36px;padding-top:16px}
  .pd li{padding:2px 14px}
  .pd b{font-size:21px}
  .pd li:first-child b{font-size:48px}
  .pd span{font-size:14px}
  .gl,.gl.n3{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
  .gl button:first-child{grid-column:1/-1;grid-row:auto;aspect-ratio:4/3}
  .lb-stage{inset:56px 0 64px}
  .lb-p,.lb-n{top:auto;bottom:8px;margin:0;width:44px;height:44px}.lb-p{left:12px}.lb-n{right:12px}
  .tm+.tm{margin-top:44px}
  .tm h2{font-size:26px}
  .tm .tp{font-size:16px}
  .tm dl>div{grid-template-columns:1fr;gap:2px;padding:10px 0}
  .tm dd{font-size:15px}
  .cmp,.cmp thead,.cmp tbody{display:block}
  .cmp tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmp thead td{display:none}
  .cmp thead th{font-size:16px;padding:10px 12px}
  .cmp tbody th{grid-column:1/-1;width:auto;padding:12px 0 4px}
  .cmp td{border-top:0;padding:4px 12px 12px;font-size:15px}
  .rv{grid-template-columns:1fr;gap:12px}
  .rv-n b{font-size:52px}
  .q{padding:20px 18px}
  .q p{font-size:17px}
  h3.dal{font-size:20px;margin-top:32px}
}
</style>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const Q = new URLSearchParams(location.search), o = Q.get("o") || "", slug = Q.get("p") || "";
  const NAZ = { zahrada: "Zimní zahrady", zaskleni: "Zasklení teras", pergola: "Pergoly", stineni: "Stínění" };
  const K = window.KRkatalog || {}, main = $("#obsah");
  const list = K[o] || [], idx = list.findIndex(p => p.k === slug), p = list[idx];

  /* neexistující typ */

<button type="button" class="lb-x" aria-label="Zavřít fotky"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button type="button" class="lb-p" aria-label="Předchozí fotka"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" class="lb-n" aria-label="Další fotka"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></dialog>`);
    const lb = $("#lb"), stage = $("#lbS"), cnt = $("#lbC"); let cur = 0, opener = null;
    const show = i => {
      cur = (i + gN) % gN; const it = gItems[cur];
      stage.innerHTML = ""; const im = document.createElement("img"); im.src = it.f + ".jpg"; im.alt = it.alt; im.draggable = false; stage.append(im);
      cnt.textContent = `${cur + 1} / ${gN}`;
      [cur + 1, cur - 1].forEach(j => { new Image().src = gItems[(j + gN) % gN].f + ".jpg"; });
    };
    $(".gl").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; opener = b; show(+b.dataset.i); if (!lb.open) lb.showModal(); lb.querySelector(".lb-x").focus(); });
    lb.querySelector(".lb-x").addEventListener("click", () => lb.close());
    lb.querySelector(".lb-p").addEventListener("click", () => show(cur - 1));
    lb.querySelector(".lb-n").addEventListener("click", () => show(cur + 1));
    lb.addEventListener("click", e => { if (e.target === lb || e.target === stage) lb.close(); });
    lb.addEventListener("close", () => { stage.innerHTML = ""; if (opener) opener.focus(); });
    lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { e.preventDefault(); show(cur - 1); } else if (e.key === "ArrowRight") { e.preventDefault(); show(cur + 1); } });
    let x0 = null;
    stage.addEventListener("pointerdown", e => { x0 = e.clientX; });
    stage.addEventListener("pointerup", e => { if (x0 === null) return; const d = e.clientX - x0; x0 = null; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); });
    stage.addEventListener("pointercancel", () => { x0 = null; });
  }

  /* video po kliknutí */
  const vid = $("#vid");
  if (vid) vid.querySelector(".play").addEventListener("click", () => {
    const fr = document.createElement("iframe");
    fr.src = `https://www.youtube-nocookie.com/embed/${V[0]}?autoplay=1&rel=0`; fr.title = V[1];
    fr.allow = "autoplay; encrypted-media; picture-in-picture"; fr.allowFullscreen = true;
    vid.innerHTML = ""; vid.appendChild(fr); fr.focus();
  });
})();
</script>
</body>
</html>
