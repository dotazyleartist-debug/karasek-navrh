<!doctype html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typ řešení | Karásek s.r.o.</title>
<meta name="description" id="mDesc" content="Zimní zahrady, zasklení teras, pergoly a stínění od Karásek s.r.o. Showroom Nemanická 5, České Budějovice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;subset=latin-ext&amp;display=swap" rel="stylesheet">
<style>
/* Stránka jednoho typu řešení, směr A (produkt.html?o=<oblast>&p=<slug>).
   Data: katalog.js, obsah-sluzeb.js (parametry), realizace-data.js (stavby). Fakta jen ze zdrojů, nic doplněného. */
:root{
  --ink:#0f1418; --muted:#4a545c; --bg:#fff; --soft:#f4f6f7; --dark:#1d2328; --line:#dde2e5;
  --red:#D22630; --red-h:#b51f28;
  --zahrada:#46bb59; --zaskleni:#00b8f1; --pergola:#ff9a1f; --stineni:#ff2d16;
  --r-card:16px; --r-btn:12px;
  --shadow:0 18px 48px rgba(15,20,24,.12), 0 2px 6px rgba(15,20,24,.06);
  --pad:32px; --max:1320px; --f:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;font-family:var(--f);font-weight:500;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-btn);z-index:99}
.skip:focus{top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 17px/1.2 var(--f);border:0;border-radius:var(--r-btn);padding:16px 22px;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,transform .15s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-h)}
.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #c3cad0}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
.lnk{font-weight:700;font-size:16px;text-underline-offset:4px}

/* hero */
.crumbs{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:15px;color:var(--muted);padding:24px 0 20px}
.crumbs a{font-weight:600;color:var(--ink);text-underline-offset:4px}
.ph-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center;padding-bottom:64px}
.ph-hero h1{font-size:60px;line-height:1.05;letter-spacing:-.03em}
.ph-hero .lead{margin-top:20px;font-size:19px;line-height:1.55;color:var(--muted);max-width:560px}
.ph-hero .acts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:28px}
.ph-img{border-radius:var(--r-card);overflow:hidden;background:var(--soft);box-shadow:var(--shadow)}
.ph-img img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.ph-img figcaption{padding:12px 18px;font-size:14px;color:var(--muted);background:#fff}

/* sekce */
.sec{padding:64px 0;border-top:1px solid var(--line)}
.sec h2{font-size:36px;max-width:760px}
.sec .sub{margin-top:12px;color:var(--muted);font-size:17px;max-width:680px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:28px}
.rgrid>*{min-width:0}
.after{margin-top:28px}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}
.par:has(>section:only-child){grid-template-columns:minmax(0,1fr)}
.par:has(>section:only-child) dl,.par dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px}
.par:has(>section:only-child) dl{grid-template-columns:repeat(3,minmax(0,1fr))}
.ph-hero .btn-dark{background:var(--red);color:#fff}
.ph-hero .btn-dark:hover{background:var(--red-h)}
.par section{background:var(--soft);border-radius:var(--r-card);padding:24px 26px}
.par h3{font-size:20px;margin-bottom:12px}
.par dl{margin:0;display:grid;gap:10px}
.par dt{font-size:14px;font-weight:700;color:var(--muted)}
.par dd{margin:0;font-size:16px;line-height:1.45}
.vyh{margin:14px 0 0;padding:0 0 0 20px;font-size:16px;line-height:1.45}
.vyh li+li{margin-top:6px}
.par dd{overflow-wrap:anywhere}
.src{margin-top:16px;font-size:14px;color:var(--muted)}
.src a{text-underline-offset:3px}
.vwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:28px}
.vid{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:16/9;background:#20282e}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vid .play{position:absolute;left:20px;bottom:20px;background:#fff;color:var(--ink)}
.vid .play:hover{background:#f1f3f4}
.vid .play svg{width:14px;height:14px}
.vwrap h3{font-size:26px;line-height:1.15}
.vwrap p{margin-top:12px;font-size:16px;color:var(--muted);max-width:440px}
.sib{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sib a{display:flex;flex-direction:column;gap:4px;height:100%;padding:16px 18px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);text-decoration:none}
.sib a:hover{box-shadow:0 0 0 1px var(--ink)}
.sib b{font-size:17px;line-height:1.3}
.sib span{font-size:14px;color:var(--muted);font-weight:600}
.cta{background:var(--dark);color:#fff;padding:64px 0}
.cta .in{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between}
.cta h2{font-size:34px;max-width:640px}
.cta p{margin-top:10px;color:#dfe5e9;max-width:560px}
.cta .btns{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.cta .btn-line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #8a949b}
.cta .btn-line:hover{box-shadow:inset 0 0 0 1.5px #fff}

/* nenalezeno */
.nf{padding:24px 0 96px}
.nf h1{font-size:48px;max-width:760px}
.nf p{margin-top:16px;font-size:18px;color:var(--muted);max-width:620px}
.nf .tl{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nf .tl a{display:block;padding:18px 20px;border-radius:14px;box-shadow:0 0 0 1px var(--line);text-decoration:none;font-weight:700;font-size:18px}
.nf .tl a:hover{box-shadow:0 0 0 1px var(--ink)}
.nf .acts{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}

@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (max-width:1100px){
  .ph-hero{grid-template-columns:1fr;gap:28px}
  .rgrid,.sib{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vwrap{grid-template-columns:1fr;gap:20px}
}
@media (max-width:820px){
  :root{--pad:16px}
  body{font-size:16px}
  .crumbs{font-size:14px;padding:16px 0 14px}
  .ph-hero{padding-bottom:40px;gap:22px}
  .ph-hero h1{font-size:38px;line-height:1.08}
  .ph-hero .lead{font-size:16px;margin-top:14px}
  .ph-hero .acts{margin-top:20px}
  .ph-hero .acts .btn{width:100%}
  .ph-img{order:-1}
  .sec{padding:40px 0}
  .sec h2,.cta h2{font-size:28px}
  .rgrid,.sib,.par,.nf .tl{grid-template-columns:1fr}
  .par section{padding:18px}
  .par dl,.par:has(>section:only-child) dl{grid-template-columns:1fr}
  .cta{padding:40px 0}
  .cta .btn{width:100%}
  .nf h1{font-size:34px}
}
</style>
<link rel="stylesheet" href="vzhled.css?v=20261126f">
</head>
<body data-page="produkt" data-oblast="zahrada">
<a class="skip" href="#obsah">Přeskočit na obsah</a>
<header id="hd"></header>
<main id="obsah"></main>
<footer id="kontakt"></footer>
<script src="realizace-data.js"></script>
<script src="katalog.js"></script>
<script src="obsah-sluzeb.js"></script>
<script src="katalogy-2026.js"></script>
<script src="web.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const Q = new URLSearchParams(location.search), o = Q.get("o") || "", slug = Q.get("p") || "";
  const NAZ = { zahrada: "Zimní zahrady", zaskleni: "Zasklení teras", pergola: "Pergoly", stineni: "Stínění" };
  const FOTO = { zahrada: "25190", zaskleni: "29532", pergola: "18873", stineni: "21454" };
  const K = window.KRkatalog || {}, main = $("#obsah");
  const list = K[o] || [], idx = list.findIndex(p => p.k === slug), p = list[idx];

  /* neexistující typ */
  if (!p) {
    document.title = "Typ nenalezen | Karásek s.r.o.";
    main.innerHTML = `<div class="wrap nf"><nav class="crumbs" aria-label="Drobečková navigace" style="padding-left:0"><a href="index.html">Úvod</a><span aria-hidden="true">/</span><span aria-current="page">Typ nenalezen</span></nav>
<h1>Tento typ jsme nenašli</h1><p>Odkaz je zřejmě starý nebo upravený. Vyberte službu, ve které typ hledáte, nebo se podívejte na hotové stavby.</p>
<ul class="tl">${Object.keys(NAZ).map(k => `<li><a href="kategorie.html?oblast=${k}">${NAZ[k]}</a></li>`).join("")}</ul>
<div class="acts"><a class="btn btn-line" href="realizace.html">Hotové stavby</a><button type="button" class="btn btn-red" id="nfAsk">Nezávazná poptávka</button></div></div>`;
    $("#nfAsk").addEventListener("click", () => KRpoptat({}));
    return;
  }

  document.body.dataset.oblast = o;
  document.title = `${p.n} | ${NAZ[o]} | Karásek s.r.o.`;
  $("#mDesc").content = p.t.slice(0, 150).replace(/\s+\S*$/, "") + "… Karásek s.r.o., České Budějovice.";

  /* stavby tohoto typu; když filtr nic nedá, stavby z celé služby (a řekneme to) */
  let f = p.f, S = f ? KR.filter(f) : [], zalozni = false;
  if (!S.length) { f = { typ: o }; S = KR.filter(f); zalozni = true; }
  /* filtr podle systému bere i jiné typy: když existují stavby s názvem typu, ukážeme jen ty */
  const KW = { bioklima: /bioklim|lamelov/i }[p.k];
  if (KW && S.some(s => KW.test(s.n))) S = S.filter(s => KW.test(s.n));
  const hero = S[idx % S.length] || S[0];
  const qs = "realizace.html?" + new URLSearchParams(f);

  /* parametry jen ze zdrojů (obsah-sluzeb.js srovnání, STRUKTURA-KARASEK-CZ.md) */
  const SR = ((window.KRobsah || {})[o] || {}).srovnani;
  const rows = ix => SR ? ix.map(i => SR.radky[i]).filter(Boolean).map(r => ({ h: r[0], d: r.slice(1).map((c, j) => [SR.sloupce[j + 1], c]).filter(x => x[1]) })) : [];
  const EXTRA = {
    "zahrada/sezonni": [{ h: "Konstrukce zimní zahrady", d: [["Stojiny", "110 × 110 mm"], ["Krokve", "105, 130 nebo 150 mm"], ["Maximální hloubka", "600 cm"], ["Sklon střechy", "4–12°"], ["Rozteč krokví", "přibližně 750 mm (Connex 3.3.2), 900 mm (PCD 16 mm)"], ["Barvy konstrukce", "RAL 7016, 8017, 9006, bílá"]] }],
    "zaskleni/lamelove": [{ h: "Patio Living Tilt", d: [["Hmotnost panelu", "až 50 kg"], ["Výška", "až 2700 mm"], ["Šířka panelu", "500–1250 mm"], ["Počet panelů", "2–4"], ["Výplně", "lamely, screen, ESG 6 mm"], ["Standardní barvy", "RAL 9006, 9007, 9010, 7016, 8014, DB702, DB703"]] }]
  };
  const ROW = { "zahrada/celorocni": [2], "zaskleni/ramove": [0], "zaskleni/bezramove": [1], "zaskleni/izolacni": [2],
    "pergola/sklo": [0], "pergola/polykarbonat": [1], "pergola/bioklima": [2], "pergola/latkova": [3], "stineni/markyzy": [0], "stineni/zaluzie": [2, 3] };
  const key = o + "/" + p.k;
  const par = (EXTRA[key] || []).concat(rows(ROW[key] || []));

  /* video jen tam, kde k typu patří (ID z BRIEF.md) */
  const VID = { "zahrada/celorocni": ["CDzwiIPHD5s", "Patio Living Therm: celoroční zimní zahrada", "../assets/video/video-therm-zimni-zahrada.jpg", "Rostislav Karásek ve video prohlídce temperované zimní zahrady Patio Living Therm."],
    "zaskleni/izolacni": ["CDzwiIPHD5s", "Patio Living Therm", "../assets/video/video-therm-zimni-zahrada.jpg", "Rostislav Karásek ve video prohlídce systému Patio Living Therm."],
    "zaskleni/bezramove": ["wmvKgEBCEmQ", "Patio Living Move 3.0", "../assets/video/video-move-showroom.jpg", "Video k bezrámovému zasklení Patio Living Move 3.0."],
    "zaskleni/ramove": ["aOCThW3DFrc", "Combi v antracitu", null, "Video k rámovému zasklení Combi v antracitu."],
    "pergola/sklo": ["xfAfjtb2okg", "Pergola se skrytým žlabem", null, "Video k pergole se skrytým žlabem."],
    "stineni/markyzy": ["R574CH3Njp0", "Markýza ARESBOX", null, "Video k markýze ARESBOX."] };
  const V = VID[key], vPoster = V ? (V[2] || (S[1] || S[0]).id && `../assets/foto/${(S[1] || S[0]).id}.jpg`) : "";

  /* sekce z katalogů Karásek 2026 (katalogy-2026.js), jen pro typy, které katalog má */
  const KAT = (window.KRkatalog2026 || {})[key];
  const katHtml = KAT ? `<section class="sec" aria-labelledby="hSys"><div class="wrap"><h2 id="hSys">Systémy a parametry</h2><p class="sub">${esc(KAT.uvod)}</p>
<div class="par">${KAT.systemy.map(s => `<section><h3>${esc(s.n)}</h3><dl>${s.par.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>${s.vyhody && s.vyhody.length ? `<ul class="vyh">${s.vyhody.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}</section>`).join("")}</div>
<p class="src">Podle katalogu Karásek 2026 (${esc(KAT.zdroj.join(", "))}). Rozměry a provedení upřesníme při zaměření.</p></div></section>` : "";

  const sib = list.filter(x => x.k !== p.k);
  const mini = S.slice(0, 3);
  const zdroj = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;

  main.innerHTML = `<div class="wrap">
<nav class="crumbs" aria-label="Drobečková navigace"><a href="index.html">Úvod</a><span aria-hidden="true">/</span><a href="kategorie.html?oblast=${o}">${NAZ[o]}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(p.n)}</span></nav>
<div class="ph-hero"><div><h1>${esc(p.n)}</h1><p class="lead">${esc(p.t)}</p>
<div class="acts"><button type="button" class="btn btn-dark" id="ask1">Poptat tento typ<span class="sr">: ${esc(p.n)}</span></button><a class="lnk" href="${qs}">Podívat se na hotové stavby</a></div></div>
<figure class="ph-img" style="margin:0"><img src="../assets/foto/${hero.id}.jpg" alt="${esc(hero.n)}" width="944" height="708"><figcaption>Z realizace: ${esc(hero.n)}</figcaption></figure></div></div>
${par.length ? `<section class="sec" aria-labelledby="hPar"><div class="wrap"><h2 id="hPar">Parametry</h2>
<div class="par">${par.map(g => `<section><h3>${esc(g.h)}</h3><dl>${g.d.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl></section>`).join("")}</div>
<p class="src">Údaje z popisu na ${zdroj(p.url, "karasek.cz")}. U konkrétní stavby se rozměry a provedení řídí zaměřením.</p></div></section>` : ""}
${katHtml}
${V ? `<section class="sec" aria-labelledby="hVid"><div class="wrap"><h2 id="hVid">Video</h2><div class="vwrap"><div class="vid" id="vid"><img src="${vPoster}" alt="${esc(V[3])}" loading="lazy"><button type="button" class="btn play"><svg aria-hidden="true" viewBox="0 0 12 12"><path fill="currentColor" d="M2 1l9 5-9 5z"/></svg>Pustit video</button></div><div><h3>${esc(V[1])}</h3><p>${esc(V[3])} Video se načte z YouTube až po kliknutí.</p></div></div></div></section>` : ""}
<section class="sec" aria-labelledby="hSt"><div class="wrap"><h2 id="hSt">Hotové stavby tohoto typu</h2>
${zalozni ? `<p class="sub">K tomuto typu zatím nemáme zvlášť označené stavby. Ukazujeme stavby ze služby ${NAZ[o]}.</p>` : ""}
<div class="rgrid">${mini.map(s => KRkarta(s, { f })).join("")}</div>
<p class="after"><a class="lnk" href="${qs}">Všechny hotové stavby tohoto typu</a></p></div></section>
<section class="sec" aria-labelledby="hSib"><div class="wrap"><h2 id="hSib">Další typy v této službě</h2>
<ul class="sib">${sib.map(x => `<li><a href="produkt.html?o=${o}&amp;p=${x.k}"><b>${esc(x.n)}</b><span>${NAZ[o]}</span></a></li>`).join("")}</ul>
<p class="after"><a class="lnk" href="kategorie.html?oblast=${o}">Celá služba: ${NAZ[o]}</a></p></div></section>
<section class="cta" aria-labelledby="hCta"><div class="wrap in"><div><h2 id="hCta">${esc(p.n)}: poradíme a zaměříme</h2><p>Napište, co plánujete. Ozveme se vám a domluvíme další postup.</p></div>
<div class="btns"><button type="button" class="btn btn-red" id="ask2">Nezávazná poptávka<span class="sr">: ${esc(p.n)}</span></button>${zdroj(p.url, "Popis na karasek.cz").replace("<a ", '<a class="btn btn-line" ')}</div></div></section>`;

  /* poptávka předvyplněná typem */
  const ask = () => {
    KRpoptat({ oblast: o });
    const ta = document.querySelector(".kp textarea[name=zprava]");
    if (ta && !ta.value.trim()) ta.value = `Dobrý den, mám zájem o: ${p.n}. `;
  };
  $("#ask1").addEventListener("click", ask); $("#ask2").addEventListener("click", ask);

  /* video po kliknutí */
  const vid = $("#vid");
  if (vid) vid.querySelector(".play").addEventListener("click", () => {
    const fr = document.createElement("iframe");
    fr.src = `https://www.youtube-nocookie.com/embed/${V[0]}?autoplay=1&rel=0`; fr.title = V[1];
    fr.allow = "autoplay; encrypted-media; picture-in-picture"; fr.allowFullscreen = true;
    vid.innerHTML = ""; vid.appendChild(fr); fr.focus();
  });
})();
</script>
</body>
</html>
