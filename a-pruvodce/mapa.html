<style>
:root{
  --ink:#0f1418; --muted:#4a545c; --bg:#fff; --soft:#f4f6f7; --dark:#1d2328; --line:#dde2e5;
  --red:#D22630; --red-h:#b51f28;
  --zahrada:#46bb59; --zaskleni:#00b8f1; --pergola:#ff9a1f; --stineni:#ff2d16;
  --r-card:16px; --r-btn:12px; --pad:32px; --max:1400px; --f:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);font-weight:500;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-btn);z-index:99}
.skip:focus{top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 17px/1.2 var(--f);border:0;border-radius:var(--r-btn);padding:16px 22px;cursor:pointer;text-decoration:none;text-align:center}
.btn-dark,.btn-red{background:var(--red);color:#fff}
.btn-dark:hover,.btn-red:hover{background:var(--red-h)}
.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #c3cad0}
.phead{padding:28px 0 24px}
.crumbs{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin-bottom:14px}
.crumbs a{font-weight:600;color:var(--ink);text-underline-offset:4px}
.phead h1{font-size:48px;line-height:1.08;max-width:820px}
.phead .lead{margin-top:12px;color:var(--muted);font-size:18px;max-width:680px}
.mapa{padding-bottom:64px}
@media (max-width:820px){
  :root{--pad:20px}
  .phead{padding:18px 0 16px}.crumbs{font-size:14px;margin-bottom:10px}
  .phead h1{font-size:32px}.phead .lead{font-size:16px;margin-top:10px}
  .mapa{padding-bottom:40px}
}
</style>
