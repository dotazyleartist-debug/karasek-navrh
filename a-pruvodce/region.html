<!doctype html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zimní zahrady, zasklení a pergoly v regionu | Karásek s.r.o.</title>
<meta name="description" id="mDesc" content="Zimní zahrady, zasklení teras, pergoly a stínění od Karásek s.r.o., showroom v Českých Budějovicích.">
<meta name="kr:cilova-url" content="https://karasek.cz/region/&lt;kraj&gt;/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;subset=latin-ext&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1418; --muted:#4a545c; --bg:#fff; --soft:#f4f6f7; --dark:#1d2328; --line:#dde2e5;
  --red:#D22630; --red-h:#b51f28;
  --r-card:16px; --r-btn:12px;
  --shadow:0 18px 48px rgba(15,20,24,.12), 0 2px 6px rgba(15,20,24,.06);
  --pad:32px; --max:1320px; --f:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;font-family:var(--f);font-weight:500;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-weight:700;line-height:1.12;letter-spacing:-.02em;margin:0}
p{margin:0}
.wrap{max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-btn);z-index:99}
.skip:focus{top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 17px/1.2 var(--f);border:0;border-radius:var(--r-btn);padding:16px 24px;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,transform .15s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-h)}
.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #c3cad0}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
.lnk{font-weight:700;font-size:16px;text-underline-offset:4px}
.crumbs{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;color:var(--muted);padding:24px 0 8px}
.crumbs a{color:var(--ink);text-underline-offset:4px}
section.sec{padding:88px 0}
.soft{background:var(--soft)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:36px}
.head h2{font-size:44px;letter-spacing:-.025em}
.head p{color:var(--muted);font-size:18px;max-width:520px;justify-self:end}
/* fotodlaždice realizace: fotka v přirozených barvách, jen tmavý přechod dole kvůli textu */
.fk{position:relative;display:block;border-radius:var(--r-card);overflow:hidden;background:#2c353c;color:#fff;text-decoration:none}
.fk img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.fk::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,17,0) 45%,rgba(10,14,17,.82));pointer-events:none}
.fk .ft-t{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px 20px 18px;display:grid;gap:4px}
.fk .ft-t b{font-size:20px;line-height:1.25;letter-spacing:-.01em}
.fk .ft-t span{font-size:14px;font-weight:600;color:#e6ebee}
.fk:hover b{text-decoration:underline;text-underline-offset:4px}
.nv{display:inline-block;margin:0 2px;padding:1px 8px;border-radius:6px;background:#fff6e0;box-shadow:inset 0 0 0 1px #ecd9a8;color:#5c4300;font-size:13px;font-weight:700;line-height:1.6;letter-spacing:.01em;white-space:nowrap;vertical-align:1px}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .btn{transition:none} }
@media (max-width:820px){
  :root{--pad:16px}
  body{font-size:16px}
  html{scroll-padding-top:72px}
  .crumbs{font-size:14px;padding:14px 0 4px}
  section.sec{padding:56px 0}
  .head{grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:22px}
  .head h2{font-size:30px}
  .head p{font-size:16px;justify-self:start}
  .fk .ft-t{padding:14px 16px}
  .fk .ft-t b{font-size:18px}
  .nv{white-space:normal}
}
.rhero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:56px;align-items:center;padding:28px 0 64px}
body .rhero h1{font-size:54px;line-height:1.06;letter-spacing:-.03em}
.rhero h1 span{display:block;color:var(--modra,#0869eb)}
.rhero .lead{margin-top:20px;font-size:19px;color:var(--muted);max-width:560px}
.rhero .acts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:28px}
.rhero figure{margin:0}
.rhero .fk img{aspect-ratio:16/11}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;list-style:none;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.facts li{padding:22px 24px 22px 0;display:grid;gap:4px;align-content:start}
.facts li+li{padding-left:24px;border-left:1px solid var(--line)}
.facts b{font-size:26px;line-height:1.15;letter-spacing:-.02em}
.facts span{font-size:15px;color:var(--muted);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.none{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px 32px;border-radius:var(--r-card);background:var(--soft);margin-bottom:28px}
.none h3{font-size:24px}
.none p{margin-top:6px;color:var(--muted);max-width:720px}
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;list-style:none;margin:0;padding:0}
.svc .fk b{text-decoration:underline;text-decoration-color:var(--kc);text-decoration-thickness:4px;text-underline-offset:7px;text-decoration-skip-ink:none}
.note{margin-top:24px;padding:16px 20px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;font-weight:600;max-width:860px}
.reg{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;list-style:none;padding:0}
.reg a{display:inline-flex;min-height:44px;align-items:center;padding:0 16px;border-radius:10px;box-shadow:inset 0 0 0 1px #c3cad0;text-decoration:none;font-weight:700}
.reg a[aria-current]{box-shadow:inset 0 0 0 2px var(--ink)}
@media (max-width:1100px){ body .rhero h1{font-size:46px} .svc{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .rhero{grid-template-columns:minmax(0,1fr);gap:22px;padding:12px 0 36px}
  .rhero figure{order:-1;margin:0 -16px}
  .rhero .fk{border-radius:0}
  body .rhero h1{font-size:36px;line-height:1.1}
  .rhero .lead{font-size:17px;margin-top:12px}
  .rhero .acts .btn{flex:1 1 100%;min-height:54px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .facts li,.facts li+li{padding:14px 0;border-left:0}
  .facts li+li{border-top:1px solid var(--line)}
  .facts b{font-size:21px}
  .grid3{grid-template-columns:minmax(0,1fr);gap:14px}
  .none{grid-template-columns:minmax(0,1fr);padding:20px 18px;gap:16px}
  .none .btn{width:100%;min-height:52px}
  .svc{gap:10px}
  .svc .fk .ft-t{padding:10px 12px}
  .svc .fk .ft-t b{font-size:16px;text-decoration-thickness:3px;text-underline-offset:5px}
}
</style>

<body data-page="region">
<a class="skip" href="#obsah">Přeskočit na obsah</a>

<header id="hd"></header>

<main id="obsah">
<div class="wrap">
  <nav class="crumbs" aria-label="Drobečková navigace"></nav>
  <div id="rBody"></div>
</div>
<section class="sec" aria-labelledby="h-real"><div class="wrap" id="rReal"></div></section>
<section class="sec soft" aria-labelledby="h-svc">
  <div class="wrap">
    <div class="head"><h2 id="h-svc">Co pro vás postavíme</h2><p>Typy, parametry a hotové stavby ke každé službě. <a href="sluzby.html">Všechny služby a typy</a></p></div>
    <ul class="svc" id="rSvc"></ul>
    <p class="note" id="rNote"></p>
    <h2 style="font-size:22px;margin-top:40px">Další regiony</h2>
    <ul class="reg" id="rReg"></ul>
  </div>
</section>
</main>

<footer id="kontakt"></footer>

<script src="realizace-data.js?v=20261128d"></script>
<script src="web.js?v=20261128g"></script>
<script>
(() => {
  /* Region podle ?r=. Realizace jen ty, které mají v realizace-data.js doloženou lokalitu (pole lok). Nic nedomýšlet. */
  const R = {
    "jizni-cechy": { n: "Jižní Čechy", v: "v Jižních Čechách", lok: "jih", foto: "18034" },
    "plzensko": { n: "Plzeňsko", v: "na Plzeňsku", lok: "", foto: "17448" },
    "vysocina": { n: "Vysočina", v: "na Vysočině", lok: "", foto: "24164" }
  };
  const SL = [["zahrada", "Zimní zahrady", "25190"], ["zaskleni", "Zasklení teras", "29532"], ["pergola", "Pergoly", "18873"], ["stineni", "Stínění", "21454"]];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const key = new URLSearchParams(location.search).get("r") || "", r = R[key], $ = s => document.querySelector(s);
  const regL = Object.entries(R).map(([k, x]) => `<li><a class="reg-a" href="region.html?r=${k}"${k === key ? ' aria-current="page"' : ""}>${x.n}</a></li>`).join("");
  if (!r) {
    document.title = "Region nenalezen | Karásek s.r.o.";
    $("#rBody").innerHTML = `<div class="rhero" style="grid-template-columns:1fr"><div><h1>Vyberte region</h1><p class="lead">Tento odkaz na region neznáme. Vyberte jeden z regionů nebo se podívejte na všechny hotové stavby.</p><ul class="reg">${regL}</ul><div class="acts"><a class="btn btn-line" href="realizace.html">Všechny realizace</a></div></div></div>`;
    return;
  }
  const S = r.lok ? KR.filter({ lokalita: r.lok }) : [];
  /* ukázka bez lokality: pro každý region jiná stavba (design-eye 28. 11.: žlutá 29570 se opakovala na 4 stránkách) */
  const hero = S[0] || KR.stavby.find(s => s.id === r.foto) || KR.stavby[0];
  const jine = KR.stavby.filter(s => !S.includes(s) && s !== hero).slice(0, 3);
  const karta = s => `<a class="fk" href="stavba.html?id=${s.id}"><img decoding="async" src="../assets/foto/${s.id}.jpg" alt="${esc(s.n)}" loading="lazy" width="944" height="708"><span class="ft-t"><span>${s.typ.map(t => KR.label.typ[t]).join(" + ")}${s.lok ? " · " + esc(KR.label.lokalita[s.lok]) : ""}</span><b>${esc(s.n)}</b></span></a>`;
  $("#rBody").innerHTML = `<section class="rhero" aria-labelledby="h1">
  <div>
    <h1 id="h1">Zimní zahrady, zasklení teras a pergoly <span>${r.v}</span></h1>
    <p class="lead">Karásek s.r.o. staví zimní zahrady, zasklení teras, pergoly a stínění od roku 1995. Sídlíme v Českých Budějovicích, kde máme showroom. ${key === "jizni-cechy" ? "Systémy si u nás prohlédnete naživo." : "Jste-li z dálky, vzorky přivezeme na zaměření."}</p>
    <div class="acts"><button type="button" class="btn btn-red" data-poptat="">Nezávazná poptávka</button><a class="lnk" href="tel:+420777727328">+420 777 727 328</a></div>
  </div>
  <figure><a class="fk" href="stavba.html?id=${hero.id}"><img decoding="async" src="../assets/foto/${hero.id}.jpg" alt="${esc(hero.n)}" width="944" height="708" fetchpriority="high"><span class="ft-t"><span>${S.length ? "Realizace " + r.v : "Ukázka realizace"}</span><b>${esc(hero.n)}</b></span></a></figure>
</section>
<ul class="facts" aria-label="Ve zkratce">
  <li><b>od roku 1995</b><span>Karásek s.r.o.</span></li>
  <li><b>Showroom 250 m²</b><span>${'<a class="kr-trasa" href="https://www.google.com/maps/dir/?api=1&destination=Kar%C3%A1sek%20s.r.o.%2C%20Nemanick%C3%A1%20437%2F5%2C%20%C4%8Cesk%C3%A9%20Bud%C4%9Bjovice" target="_blank" rel="noopener" aria-label="Trasa do showroomu v Mapách Google">'}Nemanická 5, České Budějovice</a>, Po–Pá 8–16</span></li>
  <li><b>6500+</b><span>realizací celkem</span></li>
</ul>`;
  $("#rReal").innerHTML = `<div class="head"><h2 id="h-real">Realizace ${r.v}</h2><p>${S.length ? "Stavby, u kterých lokalitu uvádíme v popisu realizace." : "Ukázky z tohoto regionu na webu zatím nemáme označené."}</p></div>
${S.length ? `<div class="grid3">${S.map(karta).join("")}</div><p class="note">U většiny zveřejněných staveb lokalitu zatím neuvádíme. Další ukázky najdete ve <a href="realizace.html">všech realizacích</a>.</p>`
  : `<div class="none"><div><h3>Ukázky ${r.v} připravujeme</h3><p>Mezitím se podívejte na hotové stavby z jiných míst. Systémy i provedení jsou stejné.</p></div><a class="btn btn-line" href="realizace.html">Všechny realizace</a></div><div class="grid3">${jine.map(karta).join("")}</div>`}`;
  $("#rSvc").innerHTML = SL.map(([k, n, f]) => `<li style="--kc:var(--kat-${k})"><a class="fk" href="kategorie.html?oblast=${k}"><img decoding="async" src="../assets/foto/${f}.jpg" alt="" loading="lazy" width="944" height="708"><span class="ft-t"><b>${n}</b><span>${KR.filter({ typ: k }).length} ${KR.stavbyNom(KR.filter({ typ: k }).length)} ve fotogalerii</span></span></a></li>`).join("");
  $("#rNote").innerHTML = key === "jizni-cechy"
    ? "Markýzy, venkovní žaluzie a rolety a vnitřní zastínění realizujeme pouze v Jižních Čechách. <a href=\"kategorie.html?oblast=stineni\">Stínění</a>"
    : `Markýzy, venkovní žaluzie a rolety a vnitřní zastínění realizujeme pouze v Jižních Čechách. Co z <a href="kategorie.html?oblast=stineni">stínění</a> postavíme ${r.v}, vám řekneme při poptávce.`;
  $("#rReg").innerHTML = regL;
})();
</script>
</body>
</html>
